# Milvus standalone —— RAG 重做（规范附录 C.4.9 Phase 1）
#
# 起停一律带 -p milvus，与业务中台的 -p ecommerce 完全隔离：
#   docker compose -p milvus up -d
#   docker compose -p milvus ps
#   docker compose -p milvus down          # 停容器、保留数据
#
# 两条纪律：
# 1. 不要 down -v。数据卷里是全量向量索引，清了要重跑 ingest --force
#    （45 片 × BGE-M3 本地推理，不算慢，但没必要）。
# 2. 这套与 ecommerce-service-backend/docker-compose.yml 共享同一个 Docker
#    内存池（本机 8.2GB）。Milvus 官方建议 ≥8GB，因此本文件给三个容器都设了
#    内存上限，避免把 ecommerce-mysql 挤 OOM —— 那个容器里有 dialogue_states
#    与三张知识表，且仓库里没有任何脚本能重建它。

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    # 只暴露控制台，9000 留在网络内部即可，减少与本机端口冲突的面
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 768M

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"   # gRPC，MILVUS_URI 指这里
      - "9091:9091"     # healthz / metrics
    depends_on:
      - etcd
      - minio
    deploy:
      resources:
        limits:
          memory: 3G

volumes:
  etcd_data:
  minio_data:
  milvus_data:

networks:
  default:
    name: milvus
