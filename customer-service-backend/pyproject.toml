[project]
name = "customer-service"
version = "1.0"
description = "电商客服项目"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "chromadb>=1.0.0",
    "cryptography>=46.0.7",
    "fastapi>=0.136.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.2.15",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.0.0",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.44.0",
    # ---- RAG 重做：BGE-M3 本地 Embedding（Phase 2）----
    # 注意：atguigu 的 pyproject 强制 torch 走 download.pytorch.org/whl/cu128，
    # 本机是 Apple Silicon 无 CUDA，必须走默认 PyPI 的 arm64 轮子，且 use_fp16 关闭。
    "pymilvus[model]>=2.5.0",
    "torch>=2.2.0",
    # pymilvus[model] 运行时还需要这两个，但没有声明为硬依赖——
    # 它会在首次构造 BGEM3EmbeddingFunction 时试图 pip install，
    # 而 uv 管理的 venv 里没有 pip，直接失败。必须显式列出。
    "datasets>=3.0.0",
    "FlagEmbedding>=1.3.0"
]
