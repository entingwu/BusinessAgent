slots:
  order_number:
    type: text
    label: order number
    description: The user's order number
    # 这里刻意不加 pattern：中台种子数据是 o3000x，但订单号的真实形态并不固定
    # （提示词里的示例就是 A20260408001 这种），约束写窄了会把合法订单号挡在门外。
    # 反向的串台（商品号填进订单号）由 product_id 的 pattern 与流程槽位白名单一起拦。

  order_status:
    type: text
    label: order status
    description: Current status of the order

  order_summary:
    type: text
    label: order summary
    description: Summary line for the order

  tracking_number:
    type: text
    label: tracking number
    description: Shipment tracking number

  logistics_company:
    type: text
    label: carrier
    description: Name of the shipping carrier

  logistics_status:
    type: text
    label: shipment progress
    description: Current progress of the shipment

  logistics_traces:
    type: text
    label: tracking history
    description: Tracking events, one per line, rendered and written by action_lookup_logistics

  product_id:
    type: text
    label: product ID
    description: Unique identifier of the product being discussed
    # 中台的商品编号统一是 p + 数字（p2001…p2024）。这条约束的来历：LLM 会把上一轮的
    # 订单号顺手填进来——实测「查订单 o30002 的物流」之后紧接着问「看看类似的商品推荐」，
    # o30002 会进 product_id，当时的 similar_product_recommendation 流程就拿着订单号去查商品。
    #
    # 该流程已被 product_recommendation（偏好收集式）取代，**目前没有任何流程把 product_id
    # 作为 collect 步骤收集**，所以这条 pattern 当前不会被用到——槽位名白名单那一关就已经
    # 把它挡在所有流程之外了。保留它是因为 product_id 仍是卡片回填的映射目标
    # （executor.py 的 expected_slots_mapping、dialogue_engine.py 的卡片分支），
    # 一旦哪个流程重新收集它，这条约束立即生效，不必再踩一遍同样的坑。
    pattern: "(?i)p\\d{3,}"

  # 下面三个偏好槽位的可选值是**匹配键**，不是给人看的文案：它们被原样填进槽位、
  # 再送去中台做属性过滤，必须和中台 attributes_json 里存的一模一样。
  #
  # 产出同一批值的地方有四处，任何改动必须同一个提交里改完：
  #   1. 2026-08-28-englishify-attribute-values.sql   中台存什么
  #   2. recommend_products.py 的 STYLE_VALUES         收敛按钮
  #   3. 这里的 description                            规划器看的允许清单
  #   4. collect 步骤的快捷回复 value                   点击回传的内容
  # 漏掉任何一处，点按钮返回空列表，而空列表和「确实没有匹配商品」在界面上完全
  # 一样，失败是静默的。检索开始大面积返回空时，第一个该查的就是这四处。
  #
  # （注意**不含**中台的属性白名单 _FILTERABLE_ATTR_KEYS：那一份只管属性*名*，
  # 从来不含值。早先的注释把它列为第四处，是错的。）
  #
  # 中台的匹配是 LOWER() + LIKE '%value%'，大小写不敏感且是子串匹配——所以
  # 值取小写只是惯例而非必需，但**子串这一点有真实后果**：size 的 small 含 'm'、
  # standard 含 's'，会和服饰的 S/M/L 互相命中。见 recommend_products.py 里
  # product_size 那段。
  product_use_case:
    type: text
    label: use case
    description: "What the product will be used for. Allowed values (these are matched against the commerce catalogue -- see 2026-08-28-englishify-attribute-values.sql): office, gaming, travel, home, sports"
  product_budget:
    type: text
    label: budget cap
    description: 'The highest price the user will accept. Only the digits matter, e.g. "500" or "under 500"'
  product_style:
    type: text
    label: style preference
    description: "Product style. Allowed values (these are matched against the commerce catalogue -- see 2026-08-28-englishify-attribute-values.sql): minimalist, business, esports, nordic, sports, retro"

  refund_reason:
    type: text
    label: refund reason
    description: Reason given for the refund request

flows:
  onboarding:
    name: welcome
    description: Greet the user when the chat window first opens and introduce the e-commerce services this assistant can handle.
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "Hi, I'm Business Agent. I can check your order status, track shipments, look up product information, or file a refund request for you."
        next: end

      - id: end
        type: end
        next: [ ]

  order_status_query:
    name: order status lookup
    description: Look up the current processing status of an order — for example awaiting payment, awaiting shipment, shipped or completed.
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "What is your order number?"

        next: lookup_order_status
      - id: lookup_order_status
        type: action
        action: action_lookup_order_status
        next: show_order_status

      - id: show_order_status
        type: action
        action: action_response
        args:
          text: "Order {{ slots.order_number }} is currently: {{ slots.order_status }}. {{ slots.order_summary }}"
        next: end
      - id: end
        type: end
        next: [ ]

  logistics_tracking:
    name: shipment tracking
    description: Look up an order's shipping progress, tracking number and carrier.
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "What is your order number?"
        next: lookup_logistics

      - id: lookup_logistics
        type: action
        action: action_lookup_logistics
        next: show_logistics

      - id: show_logistics
        type: action
        action: action_response
        args:
          text: "Order {{ slots.order_number }} is being delivered by {{ slots.logistics_company }}, tracking number {{ slots.tracking_number }}. Current progress: {{ slots.logistics_status }}.{% if slots.logistics_traces %}\n\nTracking history:\n{{ slots.logistics_traces }}{% endif %}"
        next: end

      - id: end
        type: end
        next: [ ]

  refund_request:
    name: refund request
    description: File a simple refund request, collecting the order number and the reason for the refund.
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "What is your order number?"
        next: ask_refund_reason

      - id: ask_refund_reason
        type: collect
        slot_name: refund_reason
        response:
          text: "Could you tell me briefly why you want a refund?"
        next: refund_submitted

      - id: refund_submitted
        type: action
        action: action_response
        args:
          text: "Done — the refund request for order {{ slots.order_number }} has been submitted, reason: {{ slots.refund_reason }}. We will process it as soon as possible."
        next: end


      - id: end
        type: end
        next: [ ]

  product_recommendation:
    name: product recommendation
    description: Pick and recommend products from the catalogue based on the user's use case, budget and style preferences.
    steps:
      - id: start
        type: start
        next: ask_use_case

      # 三个收集步骤都挂了快捷回复：用户点一下就把值填回来，
      # 不必自己敲。这是 3.3.3「快捷回复推进下一步」两轮收敛的实现方式。
      #
      # 三个收集步骤都挂了快捷回复：用户点一下就把值填回来，不必自己敲。
      # 这是 3.3.3「快捷回复推进下一步」两轮收敛的实现方式。
      #
      # 按钮文案就是点击后回传给规划器的用户输入，规划器把它原样填进槽位，
      # 槽位值再直接送去中台做属性过滤——所以这些值是**匹配键**，必须和
      # 中台 attributes_json 里存的一模一样。四处同步改，见
      # 2026-08-28-englishify-attribute-values.sql 头部注释。
      #
      # 写成 {label, value}：value 是小写的匹配键（中台存的就是 "office"），
      # label 是首字母大写的显示文案。两者必须能分开——匹配键用小写是惯例，
      # 而按钮上显示 "office" 是不该出现的粗糙。
      #
      # D3 之前这个分离承载的是「显示 Office、回传 办公」；D3 把中台的值翻成
      # 英文之后那个理由消失了，但**分离本身仍然有用**，只是用途从跨语言变成
      # 了大小写。预算那组仍是裸字符串，Suggestion.coerce 当成 label == value。
      - id: ask_use_case
        type: collect
        slot_name: product_use_case
        response:
          text: "Happy to help you pick. What will you mainly use it for?"
          suggestions:
            - { label: "Office",  value: "office" }
            - { label: "Gaming",  value: "gaming" }
            - { label: "Travel",  value: "travel" }
            - { label: "Home",    value: "home" }
        next: ask_budget

      - id: ask_budget
        type: collect
        slot_name: product_budget
        response:
          text: "What is your budget?"
          suggestions: [ "Under 300", "Under 500", "Under 1000", "No limit" ]
        next: ask_style

      - id: ask_style
        type: collect
        slot_name: product_style
        response:
          text: "Any style you prefer?"
          suggestions:
            - { label: "Minimalist", value: "minimalist" }
            - { label: "Business",   value: "business" }
            - { label: "Esports",    value: "esports" }
            - { label: "Nordic",     value: "nordic" }
        next: recommend

      - id: recommend
        type: action
        action: action_recommend_products
        next: wait_more

      # 收敛回路（规范 3.3.3 第 4 步）。用 action_listen 停在原地等下一句，
      # 而不是走 end——流程一旦 end，用户再说什么都得从头收集偏好。
      #
      # 关键在于快捷回复给的是**值**（"business"、"Under 300"）而不是维度名
      # （"Change style"、"Raise budget"）。上一次失败就在这里：文案里出现
      # 「预算」「用途」这类维度名，规划器会把整句当成在填那个槽位，收敛槽位
      # 永远为空。给值则相反——规划器把 "business" 填进 product_style 正是它
      # 该做的事，顺着它走而不是跟它打架。
      - id: wait_more
        type: action
        action: action_listen
        # 回路要有出口，否则 end 永远不可达、流程只能靠取消退出，
        # 而被打断的任务还会留在任务栈里等着被恢复成死循环。
        # 上限 5 轮：3.3.3 要的是「两轮收敛」，5 轮足够宽裕；上限是安全阀，
        # 不是用来把还在认真挑的用户掐掉的
        next:
          - if: "int(slots.get('product_round') or 0) >= 5"
            then: wrap_up
          - else: recommend

      # 出口不能直接连 end。action_listen 会把 step_id 推到下一步就中断本轮，
      # 于是 end 要到「用户再说一句话」的那一轮才执行——而 end 自己不产出任何
      # 消息，用户得到的是一片空白。实测：走完上限那轮点一下机器人自己刚给的
      # 收敛按钮，响应就是 messages: []，再点一次还是空。
      # 收尾必须有一句话，并且给出真正的下一步
      - id: wrap_up
        type: action
        action: action_response
        args:
          text: "We have been through a few rounds. If nothing here fits, tell me what you are after from a different angle, or I can hand you to a human agent."
          suggestions: [ "Start over", "Talk to a human" ]
        next: end

      - id: end
        type: end
        next: [ ]

  human_handoff:
    name: human agent
    description: Hand the current conversation over to a human agent.
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "Sure, I am transferring you to a human agent — one moment."
        next: end

      - id: end
        type: end
        next: [ ]