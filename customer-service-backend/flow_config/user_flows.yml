slots:
  order_number:
    type: text
    label: 订单号
    description: 用户的订单号
    # 这里刻意不加 pattern：中台种子数据是 o3000x，但订单号的真实形态并不固定
    # （提示词里的示例就是 A20260408001 这种），约束写窄了会把合法订单号挡在门外。
    # 反向的串台（商品号填进订单号）由 product_id 的 pattern 与流程槽位白名单一起拦。

  order_status:
    type: text
    label: 订单状态
    description: 订单当前状态

  order_summary:
    type: text
    label: 订单摘要
    description: 订单摘要信息

  tracking_number:
    type: text
    label: 物流单号
    description: 物流单号

  logistics_company:
    type: text
    label: 物流公司
    description: 物流公司名称

  logistics_status:
    type: text
    label: 物流进度
    description: 物流当前进度

  logistics_traces:
    type: text
    label: 物流轨迹
    description: 物流轨迹节点，每行一个，由 action_lookup_logistics 渲染好后写入

  product_id:
    type: text
    label: 商品ID
    description: 当前咨询商品的唯一标识
    # 中台的商品编号统一是 p + 数字（p2001…p2024）。这条约束的来历：LLM 会把上一轮的
    # 订单号顺手填进来——实测「查订单 o30002 的物流」之后紧接着问「看看类似的商品推荐」，
    # o30002 会进 product_id，当时的 similar_product_recommendation 流程就拿着订单号去查商品。
    #
    # 该流程已被 product_recommendation（偏好收集式）取代，**目前没有任何流程把 product_id
    # 作为 collect 步骤收集**，所以这条 pattern 当前不会被用到——槽位名白名单那一关就已经
    # 把它挡在所有流程之外了。保留它是因为 product_id 仍是卡片回填的映射目标
    # （executor.py 的 expected_slots_mapping、dialogue_engine.py 的卡片分支），
    # 一旦哪个流程重新收集它，这条约束立即生效，不必再踩一遍同样的坑。
    pattern: "(?i)p\\d{3,}"

  product_use_case:
    type: text
    label: 使用场景
    description: 商品的使用场景。可选值：办公、游戏、差旅、居家、健身、通勤
  product_budget:
    type: text
    label: 预算上限
    description: 用户能接受的价格上限，只取数字部分，例如“500”“500元以内”
  product_style:
    type: text
    label: 风格偏好
    description: 商品风格。可选值：极简、商务、电竞、北欧、运动

  refund_reason:
    type: text
    label: 退款原因
    description: 申请退款的原因

flows:
  onboarding:
    name: 欢迎引导
    description: 在聊天窗口初次打开时欢迎用户，并介绍助手可处理的电商服务。这个 flow 通常由系统主动触发。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "你好，我是 Business Agent。我可以帮你查订单状态、查物流、了解商品信息，或者提交退款申请。"
        next: end

      - id: end
        type: end
        next: [ ]

  order_status_query:
    name: 订单状态查询
    description: 帮用户查询订单当前的处理状态，例如待付款、待发货、已发货或已完成。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我你的订单号。"

        next: lookup_order_status
      - id: lookup_order_status
        type: action
        action: action_lookup_order_status
        next: show_order_status

      - id: show_order_status
        type: action
        action: action_response
        args:
          text: "订单{{ slots.order_number }}当前状态是：{{ slots.order_status }}。{{ slots.order_summary }}"
        next: end
      - id: end
        type: end
        next: [ ]

  logistics_tracking:
    name: 物流查询
    description: 帮用户查询订单物流进度、物流单号和配送公司信息。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我你的订单号。"
        next: lookup_logistics

      - id: lookup_logistics
        type: action
        action: action_lookup_logistics
        next: show_logistics

      - id: show_logistics
        type: action
        action: action_response
        args:
          text: "订单{{ slots.order_number }}由{{ slots.logistics_company }}配送，物流单号是{{ slots.tracking_number }}。当前进度：{{ slots.logistics_status }}。{% if slots.logistics_traces %}\n\n物流轨迹：\n{{ slots.logistics_traces }}{% endif %}"
        next: end

      - id: end
        type: end
        next: [ ]

  refund_request:
    name: 退款申请
    description: 帮用户提交简单的退款申请，收集订单号和退款原因。
    steps:
      - id: start
        type: start
        next: ask_order_number

      - id: ask_order_number
        type: collect
        slot_name: order_number
        response:
          text: "请告诉我你的订单号。"
        next: ask_refund_reason

      - id: ask_refund_reason
        type: collect
        slot_name: refund_reason
        response:
          text: "请简单说一下退款原因。"
        next: refund_submitted

      - id: refund_submitted
        type: action
        action: action_response
        args:
          text: "好的，订单{{ slots.order_number }}的退款申请已提交，原因是：{{ slots.refund_reason }}。后续会尽快为你处理。"
        next: end


      - id: end
        type: end
        next: [ ]

  product_recommendation:
    name: 商品推荐
    description: 根据用户的用途、预算、风格等偏好，从商品目录里挑选并推荐商品。
    steps:
      - id: start
        type: start
        next: ask_use_case

      # 三个收集步骤都挂了快捷回复：用户点一下就把值填回来，
      # 不必自己敲。这是 3.3.3「快捷回复推进下一步」两轮收敛的实现方式
      - id: ask_use_case
        type: collect
        slot_name: product_use_case
        response:
          text: "好的，我帮你挑。主要想用在什么场景？"
          suggestions: [ "办公", "游戏", "差旅", "居家" ]
        next: ask_budget

      - id: ask_budget
        type: collect
        slot_name: product_budget
        response:
          text: "预算大概多少？"
          suggestions: [ "300 以内", "500 以内", "1000 以内", "不限" ]
        next: ask_style

      - id: ask_style
        type: collect
        slot_name: product_style
        response:
          text: "喜欢什么风格？"
          suggestions: [ "极简", "商务", "电竞", "北欧" ]
        next: recommend

      - id: recommend
        type: action
        action: action_recommend_products
        next: wait_more

      # 收敛回路（规范 3.3.3 第 4 步）。用 action_listen 停在原地等下一句，
      # 而不是走 end——流程一旦 end，用户再说什么都得从头收集偏好。
      #
      # 关键在于快捷回复给的是**值**（「商务」「300 以内」）而不是维度名
      # （「换个风格」「放宽预算」）。上一次失败就在这里：文案里出现「预算」
      # 「用途」这类维度名，规划器会把整句当成在填那个槽位，收敛槽位永远为空。
      # 给值则相反——规划器把「商务」填进 product_style 正是它该做的事，
      # 顺着它走而不是跟它打架。
      - id: wait_more
        type: action
        action: action_listen
        # 回路要有出口，否则 end 永远不可达、流程只能靠取消退出，
        # 而被打断的任务还会留在任务栈里等着被恢复成死循环。
        # 上限 5 轮：3.3.3 要的是「两轮收敛」，5 轮足够宽裕；上限是安全阀，
        # 不是用来把还在认真挑的用户掐掉的
        next:
          - if: "int(slots.get('product_round') or 0) >= 5"
            then: wrap_up
          - else: recommend

      # 出口不能直接连 end。action_listen 会把 step_id 推到下一步就中断本轮，
      # 于是 end 要到「用户再说一句话」的那一轮才执行——而 end 自己不产出任何
      # 消息，用户得到的是一片空白。实测：走完上限那轮点一下机器人自己刚给的
      # 收敛按钮，响应就是 messages: []，再点一次还是空。
      # 收尾必须有一句话，并且给出真正的下一步
      - id: wrap_up
        type: action
        action: action_response
        args:
          text: "我们已经挑了几轮了。要是还没看到合适的，可以换个思路重新跟我说说需求，或者我帮你转人工。"
          suggestions: [ "重新推荐", "转人工" ]
        next: end

      - id: end
        type: end
        next: [ ]

  human_handoff:
    name: 人工客服
    description: 将当前对话转交给人工客服处理。
    steps:
      - id: start
        type: start
        next: respond

      - id: respond
        type: action
        action: action_response
        args:
          text: "好的，我来为你转接人工客服，请稍等。"
        next: end

      - id: end
        type: end
        next: [ ]