flows:
  system_task_started:
    description: Flow for acknowledging that a new task has started
    name: task started acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          mode: static
          text: "Sure, let's start with {{ context.started_flow_name }}."
        next: end

      - id: end
        type: end
        next: []

  system_collect_information:
    description: Flow for asking the user for a slot value during a collect step
    name: collect information
    steps:
      - id: start
        type: start
        next: ask

      - id: ask
        type: action
        action: action_response
        args: context.response   # text comes from context.response, e.g. "What is your order number?"

        next: listen

      - id: listen
        type: action
        action: action_listen    # 引擎不能在向下执行（停止）---action_listen
        next: end

      - id: end
        type: end
        next: []
  system_task_resumed:
    description: Flow for acknowledging that a paused task has been resumed
    name: task resumed acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          mode: static
          text: "Alright, picking up where we left off with {{ context.resumed_flow_name }}."
        next: end

      - id: end
        type: end
        next: []

  system_task_resume_failed:
    description: Flow for explaining that no paused task can be resumed
    name: task resume failed acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          text: "There is nothing in progress to pick up. Tell me what you would like to start and I will take it from the top."
        next: end

      - id: end
        type: end
        next: [ ]



  system_task_cancel_failed:
    description: Flow for explaining that there is no running task to cancel
    name: task cancel failed acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          text: "Nothing is in progress, so there is nothing to cancel. I can check an order, track a shipment, or file a refund request."
        next: end

      - id: end
        type: end
        next: [ ]


  system_task_interrupted:
    description: Flow for acknowledging that the current task has been interrupted
    name: task interrupted acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          mode: static
          text: "Sure — let's put {{ context.interrupted_flow_name }} aside for now and handle {{ context.started_flow_name }} first."
        next: end

      - id: end
        type: end
        next: []

  system_task_canceled:
    description: Flow for acknowledging that the current task was canceled
    name: task canceled acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge


      - id: acknowledge
        type: action
        action: action_response
        args:
          mode: static
          text: "Done — I have cancelled {{ context.canceled_flow_name }} for you."
        next: end

      - id: end
        type: end
        next: []

  system_cannot_handle:
    description: Flow for handling requests the assistant cannot support
    name: cannot handle request
    steps:
      - id: start
        type: start
        next:
          - if: "context.get('reason') == 'clarification_rejected'"
            then: clarification_rejected
          - if: "context.get('reason') == 'not_supported'"
            then: not_supported
          - else: ask_rephrase

      - id: clarification_rejected
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "It looks like I misread that. Could you tell me again — do you want to check an order, track a shipment, or file a refund request?"
          prompt: |
            You are an e-commerce customer service assistant. Keep your tone natural, friendly and brief.
            Rewrite the suggested reply below as one more natural sentence in English.
            Keep the meaning, do not expand it, and always answer in English whatever language
            the user wrote in.
            Conversation context:
            {history}
            User's latest message:
            User: {user_message}
            Suggested reply: {current_response}
            Rewritten reply:
        next: end

      - id: not_supported
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "I understand what you are asking for, but that capability is not connected yet."
          prompt: |
            You are an e-commerce customer service assistant. Keep your tone natural, friendly and brief.
            Rewrite the suggested reply below as one more natural sentence in English.
            Keep the meaning, do not expand it, and always answer in English whatever language
            the user wrote in.
            Conversation context:
            {history}
            User's latest message:
            User: {user_message}
            Suggested reply: {current_response}
            Rewritten reply:
        next: end

      - id: ask_rephrase
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "Sorry, I did not quite follow. Could you be a bit more specific about the shopping issue you need help with?"
          prompt: |
            You are an e-commerce customer service assistant. Keep your tone natural, friendly and brief.
            Rewrite the suggested reply below as one more natural sentence in English.
            Keep the meaning, do not expand it, and always answer in English whatever language
            the user wrote in.
            Conversation context:
            {history}
            User's latest message:
            User: {user_message}
            Suggested reply: {current_response}
            Rewritten reply:
        next: end

      - id: end
        type: end
        next: [ ]