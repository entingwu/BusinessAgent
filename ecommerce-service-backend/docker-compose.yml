services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: commerce
      MYSQL_USER: atguigu
      MYSQL_PASSWORD: Atguigu.123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主机用 13306 连接，避免和本机已有的 MySQL 3306 冲突
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 目录下的 .sql 只在数据卷首次初始化时执行一次
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: ecommerce-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 直接用IP替换为服务名 mysql
      # user:password
      DATABASE_URL: mysql+pymysql://atguigu:Atguigu.123@mysql:3306/commerce?charset=utf8mb4
      TZ: Asia/Shanghai
    ports:
      - "18081:18081"

volumes:
  mysql-data:
